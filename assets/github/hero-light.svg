<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="V3 Code — Zero-telemetry, autonomous GUI for local AI coding agents">
  <defs>
    <linearGradient id="canvas-bg-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <radialGradient id="glow-tr-l" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-bl-l" cx="12%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo-bg-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#151D28"/>
    </linearGradient>
    <linearGradient id="logo-accent-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <pattern id="dot-grid-l" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.1" fill="#64748B" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="canvas-clip-l">
      <rect x="1" y="1" width="1198" height="338" rx="23.5"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="url(#canvas-bg-l)" stroke="#CBD5E1" stroke-width="1"/>
  <g clip-path="url(#canvas-clip-l)">
    <rect x="1" y="1" width="1198" height="338" fill="url(#dot-grid-l)"/>
    <rect x="1" y="1" width="1198" height="338" fill="url(#glow-tr-l)"/>
    <rect x="1" y="1" width="1198" height="338" fill="url(#glow-bl-l)"/>
  </g>

  <!-- V3 Emblem -->
  <g transform="translate(56, 92) scale(0.15234375)">
    <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#logo-bg-l)" stroke="#10B981" stroke-opacity="0.55" stroke-width="20"/>
    <path d="M210 310 L318 310 L404 612 L490 310 L594 310 L452 730 L352 730 Z" fill="url(#logo-accent-l)"/>
    <path d="M618 310 L812 310 L812 392 L712 486 L744 486 C794 486 828 524 828 584 L828 634 C828 696 782 736 710 736 L608 736 L608 656 L706 656 C730 656 742 642 742 618 L742 596 C742 572 728 558 702 558 L628 558 L628 492 L716 392 L618 392 Z" fill="#F8FAFC"/>
  </g>

  <!-- Title + Badge -->
  <text x="248" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.2" fill="#0F172A">V3 Code</text>
  <rect x="492" y="102" width="132" height="32" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
  <text x="558" y="123" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#047857">v0.2.0 · MIT</text>

  <!-- Tagline -->
  <text x="248" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">Zero-telemetry, autonomous GUI for local AI coding agents</text>
  <text x="248" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#64748B">Linux · Windows · macOS · Android · iPhone PWA · Standalone CLI</text>

  <!-- Privacy Pills -->
  <g transform="translate(248, 228)">
    <rect x="0" y="0" width="144" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="19" cy="17" r="4.5" fill="#059669"/>
    <text x="33" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">0 Telemetry</text>

    <rect x="156" y="0" width="166" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="175" cy="17" r="4.5" fill="#059669"/>
    <text x="189" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">0 Auto-Updates</text>

    <rect x="334" y="0" width="154" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="353" cy="17" r="4.5" fill="#059669"/>
    <text x="367" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1E293B">0 Cloud Relay</text>
  </g>

  <!-- Right-side Local Isolation Terminal Card -->
  <g transform="translate(840, 52)">
    <rect x="0" y="0" width="312" height="236" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="312" height="34" rx="16" fill="#1E293B"/>
    <rect x="0" y="18" width="312" height="16" fill="#1E293B"/>
    <line x1="0" y1="34" x2="312" y2="34" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#475569"/>
    <circle cx="36" cy="17" r="5" fill="#475569"/>
    <circle cx="52" cy="17" r="5" fill="#475569"/>
    <text x="156" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="11.5" fill="#CBD5E1">v3 — local runtime</text>

    <text x="20" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="13" fill="#34D399">$</text>
    <text x="36" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="13" fill="#F8FAFC">v3 --host 127.0.0.1</text>

    <text x="20" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="12.5" fill="#94A3B8">home</text>
    <text x="116" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="12.5" fill="#E2E8F0">~/.v3</text>

    <text x="20" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="12.5" fill="#94A3B8">listen</text>
    <text x="116" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="12.5" fill="#E2E8F0">127.0.0.1:3873</text>

    <text x="20" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="12.5" fill="#94A3B8">telemetry</text>
    <text x="116" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="12.5" fill="#34D399">disabled (0 B)</text>

    <text x="20" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="12.5" fill="#94A3B8">updates</text>
    <text x="116" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="12.5" fill="#34D399">disabled</text>

    <line x1="20" y1="194" x2="292" y2="194" stroke="#334155" stroke-width="1"/>
    <circle cx="26" cy="214" r="4.5" fill="#34D399"/>
    <text x="40" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#6EE7B7">outbound: 0 connections</text>
  </g>
</svg>
